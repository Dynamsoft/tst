server:
  port: 5000
  ssl:
    enabled: true
    key-store-type: PKCS12
    # key-store / key-store-password / key-alias are set at startup in Application.kt,
    # after the self-signed dev certificate has been generated.

spring:
  application:
    name: mrz-kotlin-server
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  mvc:
    log-request-details: false

logging:
  level:
    root: INFO
