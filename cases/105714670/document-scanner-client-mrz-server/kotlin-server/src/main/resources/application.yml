server:
  # Bound on all interfaces, so the demo is reachable from another machine.
  # Override with APP_PORT; keep the default in sync with Application.kt.
  port: ${APP_PORT:8080}
  ssl:
    enabled: true
    key-store-type: PKCS12
    # key-store / key-store-password / key-alias are set at startup in Application.kt,
    # after the self-signed dev certificate has been generated.

spring:
  application:
    name: mrz-kotlin-server
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
      # Keep uploads in memory so a user's document is never written to disk.
      # This is the size above which the servlet container spills an upload to its
      # temp directory; the default is 0B, meaning it always does. Held at or above
      # max-file-size, no upload is ever spilled. Must stay >= max-file-size.
      file-size-threshold: 20MB
  mvc:
    log-request-details: false

logging:
  level:
    root: INFO
