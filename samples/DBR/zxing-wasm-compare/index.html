<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ZXing (BarcodeDetector → zxing-wasm → @zxing/browser) + eruda</title>
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>
  <script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>
  <style>video { width: 100%; max-width: 640px; background: #000; }</style>
</head>
<body>
  <button id="start">Start</button>
  <button id="stop">Stop</button>
  <div><video id="video" playsinline muted></video></div>
  <pre id="result"></pre>
  <script>
    // Decode chain: native BarcodeDetector → zxing-wasm in a Worker → JS @zxing/browser (only if the worker fails).
    const workerSrc = `
      importScripts("https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.6/dist/iife/reader/index.js");
      const ready = ZXingWASM.prepareZXingModule({ fireImmediately: true });
      const options = { formats: ["QRCode"], maxNumberOfSymbols: 1, tryHarder: true,
        tryRotate: true, tryInvert: true, tryDownscale: true, tryDenoise: true };
      async function read(image) {
        for (const binarizer of ["LocalAverage", "GlobalHistogram"]) {
          const codes = await ZXingWASM.readBarcodes(image, { ...options, binarizer });
          const code = codes.find((c) => c.isValid && c.text);
          if (code) return code.text;
        }
      }
      async function decode(data) {
        const direct = await read(data);
        if (direct) return direct;
        const src = new OffscreenCanvas(data.width, data.height);
        src.getContext("2d").putImageData(data, 0, 0);
        for (const scale of [0.5, 0.25]) {
          const w = Math.round(data.width * scale), h = Math.round(data.height * scale);
          if (Math.min(w, h) < 64) continue;
          const ctx = new OffscreenCanvas(w, h).getContext("2d", { willReadFrequently: true });
          ctx.imageSmoothingQuality = "high";
          ctx.drawImage(src, 0, 0, w, h);
          const text = await read(ctx.getImageData(0, 0, w, h));
          if (text) return text;
        }
      }
      ready.then(() => postMessage({ ready: true }), () => postMessage({ error: true }));
      onmessage = async (e) => {
        try { await ready; postMessage({ id: e.data.id, text: await decode(e.data.image) }); }
        catch { postMessage({ id: e.data.id, error: true }); }
      };`;

    const video = document.getElementById("video");
    const out = document.getElementById("result");
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    let native, worker, workerFailed = false, jsReader, stream, running = false, nextId = 0;

    try { if ("BarcodeDetector" in window) native = new BarcodeDetector({ formats: ["qr_code"] }); } catch {}

    function startWorker() {
      worker = new Worker(URL.createObjectURL(new Blob([workerSrc], { type: "text/javascript" })));
      worker.onerror = () => { workerFailed = true; console.warn("zxing-wasm worker failed; using @zxing/browser"); };
      worker.addEventListener("message", (e) => {
        if (e.data.ready) console.log("zxing-wasm ready");
        if (e.data.error && !e.data.id) worker.onerror();
      });
    }

    function decodeWasm(image) {
      return new Promise((resolve, reject) => {
        const id = ++nextId;
        const timer = setTimeout(() => { worker.removeEventListener("message", onMsg); reject(new Error("timeout")); }, 1500);
        const onMsg = (e) => {
          if (e.data.id !== id) return;
          clearTimeout(timer);
          worker.removeEventListener("message", onMsg);
          e.data.error ? reject(new Error("decode error")) : resolve(e.data.text);
        };
        worker.addEventListener("message", onMsg);
        worker.postMessage({ id, image }, [image.data.buffer]);
      });
    }

    async function decodeFrame() {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0);
      if (native) {
        // Stalled/slow/failing native detectors are dropped so ZXing always runs.
        const started = performance.now();
        let slow;
        try {
          const codes = await Promise.race([
            native.detect(canvas),
            new Promise((resolve) => { slow = setTimeout(() => { native = undefined; console.warn("BarcodeDetector stalled; disabled"); resolve(); }, 80); }),
          ]);
          if (codes?.[0]) return { text: codes[0].rawValue, engine: "native" };
          if (performance.now() - started > 120) native = undefined;
        } catch { native = undefined; }
        finally { clearTimeout(slow); }
      }
      if (!workerFailed) {
        try {
          const text = await decodeWasm(ctx.getImageData(0, 0, canvas.width, canvas.height));
          return text ? { text, engine: "wasm" } : undefined;
        } catch { workerFailed = true; }
      }
      jsReader ??= new ZXingBrowser.BrowserQRCodeReader();
      try { return { text: jsReader.decodeFromCanvas(canvas).getText(), engine: "zxing-js" }; } catch {}
    }

    async function loop() {
      while (running) {
        if (video.readyState >= 2) {
          const t = performance.now();
          const r = await decodeFrame();
          if (r) {
            const ms = Math.round(performance.now() - t);
            out.textContent = `${r.engine} (${ms} ms): ${r.text}\n` + out.textContent;
            console.log(r.engine, ms, r.text);
          }
        }
        await new Promise((res) => requestAnimationFrame(res));
      }
    }

    document.getElementById("start").onclick = async () => {
      if (running) return;
      if (!worker) startWorker();
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } },
      });
      video.srcObject = stream;
      await video.play();
      running = true;
      loop();
    };
    document.getElementById("stop").onclick = () => {
      running = false;
      stream?.getTracks().forEach((t) => t.stop());
      video.srcObject = null;
    };
  </script>
</body>
</html>
