<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DBR 11 + eruda (requestCamera 'quick-back')</title>
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>
  <script src="https://cdn.jsdelivr.net/npm/dynamsoft-barcode-reader-bundle@11.6.5000/dist/dbr.bundle.js"></script>
  <style>#camera-view-container { width: 100%; height: 70vh; }</style>
</head>
<body>
  <button id="scan">Scan</button>
  <div id="camera-view-container"></div>
  <pre id="result"></pre>
  <script>
    Dynamsoft.License.LicenseManager.initLicense(
      "DLS2eyJoYW5kc2hha2VDb2RlIjoiMTA0NzA1MDIxLU1UQTBOekExTURJeExYZGxZaTFVY21saGJGQnliMm8iLCJtYWluU2VydmVyVVJMIjoiaHR0cHM6Ly9tZGxzLmR5bmFtc29mdG9ubGluZS5jb20vIiwib3JnYW5pemF0aW9uSUQiOiIxMDQ3MDUwMjEiLCJzdGFuZGJ5U2VydmVyVVJMIjoiaHR0cHM6Ly9zZGxzLmR5bmFtc29mdG9ubGluZS5jb20vIiwiY2hlY2tDb2RlIjotMTQ4OTkxODU4OH0="
    );

    document.getElementById("scan").onclick = async () => {
      const cameraView = await Dynamsoft.DCE.CameraView.createInstance();
      document.querySelector("#camera-view-container").append(cameraView.getUIElement());
      const cameraEnhancer = await Dynamsoft.DCE.CameraEnhancer.createInstance(cameraView);

      const router = await Dynamsoft.CVR.CaptureVisionRouter.createInstance();
      router.setInput(cameraEnhancer);
      router.addResultReceiver({
        onDecodedBarcodesReceived: (result) => {
          if (!result.barcodeResultItems.length) return;
          console.log(result);
          document.getElementById("result").textContent = result.barcodeResultItems
            .map((item) => `${item.formatString}: ${item.text}`).join("\n");
        },
      });

      // requestCamera only selects the 'quick-back' preset ({ facingMode: "environment" }, no camera enumeration);
      // open() then starts the camera with that preset.
      await cameraEnhancer.requestCamera("quick-back");
      await cameraEnhancer.open();
      await router.startCapturing("ReadSingleBarcode");
    };
  </script>
</body>
</html>
