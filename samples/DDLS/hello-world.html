<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>DDLS v3 — Hello World (default UI)</title>
		<style>
			body {
				font-family: system-ui, sans-serif;
				margin: 1rem;
			}
			#images {
				display: flex;
				gap: 0.5rem;
				flex-wrap: wrap;
			}
			#images canvas {
				max-height: 10rem;
				width: auto;
				border: 1px solid #ccc;
			}
			#out {
				white-space: pre-wrap;
				background: #f5f5f5;
				padding: 0.5rem;
			}
		</style>
		<script src="dist/ddls.bundle.js"></script>
	</head>
	<body>
		<h1>Driver License Scanner — Hello World</h1>
		<button id="scan">Scan a driver license</button>
		<div id="images"></div>
		<pre id="out"></pre>

		<script type="module">
			const { DriverLicenseScanner, DriverLicenseDataLabel, EnumResultStatus } = Dynamsoft;
			const out = document.getElementById("out");
			const images = document.getElementById("images");
			const log = (text) => {
				out.textContent += `${text}\n`;
			};

			document.getElementById("scan").addEventListener("click", async () => {
				out.textContent = "";
				images.innerHTML = "";

				const scanner = new DriverLicenseScanner({
					license: "DLS2eyJoYW5kc2hha2VDb2RlIjoiMjAwMDAwLTEwMzk4OTAwMyIsIm1haW5TZXJ2ZXJVUkwiOiJodHRwczovL21sdHMuZHluYW1zb2Z0LmNvbS8iLCJvcmdhbml6YXRpb25JRCI6IjIwMDAwMCIsInN0YW5kYnlTZXJ2ZXJVUkwiOiJodHRwczovL3NsdHMuZHluYW1zb2Z0LmNvbS8iLCJjaGVja0NvZGUiOjk0NTQ3NzkxMX0=",
					templateFilePath: "dist/ddls.template.json",
					uiPath: "dist/ddls.ui.xml",
					// Inline verify: each side waits for "Use photo" / "Retake".
					showCaptureConfirmation: true,
				});

				const result = await scanner.launch();
				log(
					`status: ${EnumResultStatus[result.status.code]}${result.rejectionReason ? ` (${result.rejectionReason})` : ""}`,
				);

				const addCanvas = (label, item) => {
					if (item?.toCanvas) {
						const canvas = item.toCanvas();
						canvas.title = label;
						images.append(canvas);
					}
				};
				addCanvas("front", result.frontImage?.deskewedImageResult);
				addCanvas("back", result.backImage?.deskewedImageResult);
				addCanvas("portrait", result.portraitImage);
				for (const [field, value] of Object.entries(result.licenseData ?? {})) {
					if (value === undefined || value === "" || field.startsWith("_")) continue;
					log(`${DriverLicenseDataLabel[field] ?? field}: ${JSON.stringify(value)}`);
				}
			});
		</script>
	</body>
</html>
